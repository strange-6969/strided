name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Spaced repetition and dataset gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spaced repetition suite
        run: python3 tools/test_srs.py

      - name: Dataset integrity
        run: python3 tools/validate_dataset.py

      # Catches a template hole or a typo'd import before it reaches a deploy.
      - name: Module syntax
        run: |
          for f in app/js/*.js tools/shots.js tools/e2e.js tools/prod_check.js; do
            node --check "$f"
          done

      - name: JSON well-formed
        run: python3 -c "import json;[json.load(open(p)) for p in ['app/data/problems.json','package.json']];print('json ok')"

      # The design system bans em-dashes in anything a learner reads.
      - name: No em-dashes in shipped assets
        run: |
          if grep -rn $'\u2014\|\u2013' app/index.html app/css app/js; then
            echo "em-dash or en-dash found in shipped assets"
            exit 1
          fi
          echo "no em-dashes"

      - name: Fonts are self-hosted
        run: |
          for f in app/assets/fonts/space-grotesk.woff2 app/assets/fonts/jetbrains-mono.woff2; do
            test -s "$f" || { echo "missing font: $f"; exit 1; }
          done
          if grep -q 'fonts.googleapis.com\|fonts.gstatic.com' app/index.html app/css/app.css; then
            echo "external font reference found, fonts must be self-hosted"
            exit 1
          fi
          echo "fonts ok"

  browser-flows:
    name: Browser flows against a real page
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The learner-facing promises: mastery actually removes a problem from
      # rotation, releasing it returns it, and a backup restores everything.
      # None of that is visible by rendering the page, so it is driven for real.
      - name: Install Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the app
        run: python3 -m http.server 8788 --directory app &

      - name: Wait for the server
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8788/ >/dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "server did not start"; exit 1

      - name: Mastery, release, export and import
        run: node tools/flows.js

      - name: Every problem renders in every language
        run: node tools/e2e.js

      - name: Responsive screenshots and overflow
        run: node tools/shots.js
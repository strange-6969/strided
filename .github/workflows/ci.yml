name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Spaced repetition and dataset gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spaced repetition suite
        run: python3 tools/test_srs.py

      - name: Dataset integrity
        run: python3 tools/validate_dataset.py

      # Catches a template hole or a typo'd import before it reaches a deploy.
      - name: Module syntax
        run: |
          for f in app/js/*.js tools/shots.js tools/e2e.js tools/prod_check.js; do
            node --check "$f"
          done

      - name: JSON well-formed
        run: python3 -c "import json;[json.load(open(p)) for p in ['app/data/problems.json','package.json']];print('json ok')"

      # The design system bans em-dashes in anything a learner reads.
      - name: No em-dashes in shipped assets
        run: |
          if grep -rn $'\u2014\|\u2013' app/index.html app/css app/js; then
            echo "em-dash or en-dash found in shipped assets"
            exit 1
          fi
          echo "no em-dashes"

      - name: Fonts are self-hosted
        run: |
          for f in app/assets/fonts/space-grotesk.woff2 app/assets/fonts/jetbrains-mono.woff2; do
            test -s "$f" || { echo "missing font: $f"; exit 1; }
          done
          # No CDN font link may appear in the served HTML.
          if grep -q 'fonts.googleapis.com\|fonts.gstatic.com' app/index.html app/css/app.css; then
            echo "external font reference found, fonts must be self-hosted"
            exit 1
          fi
          echo "fonts ok"